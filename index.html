<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Family Checklist</title>
  <style>
    :root {
      --ink: #1c2633;
      --muted: #64748b;
      --paper: #fffdf8;
      --line: #d9e1dc;
      --green: #277864;
      --blue: #244b73;
      --amber: #9c6b25;
      --soft: #f5f8f4;
      --done: #2f8f70;
      font-family: Inter, Segoe UI, system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 8%, rgba(39, 120, 100, 0.12), transparent 30rem),
        radial-gradient(circle at 88% 4%, rgba(36, 75, 115, 0.1), transparent 26rem),
        linear-gradient(180deg, #fffdf8 0%, #f6f3ec 100%);
    }

    html {
      scroll-behavior: smooth;
    }

    button,
    textarea {
      font: inherit;
    }

    .page {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0 32px;
    }

    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      padding: 16px 0 22px;
      border-bottom: 1px solid var(--line);
    }

    h1 {
      margin: 0;
      color: var(--blue);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 7vw, 4.6rem);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .source {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      margin: 22px 0;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.82);
      box-shadow: 0 12px 30px rgba(28, 38, 51, 0.06);
    }

    .progress-wrap {
      display: grid;
      gap: 7px;
    }

    .progress-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .progress-meta strong {
      color: var(--ink);
    }

    .progress {
      height: 12px;
      overflow: hidden;
      border: 1px solid #ccd8d1;
      border-radius: 999px;
      background: #f2eee5;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--blue));
      transition: width 180ms ease;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: flex-end;
    }

    .action-btn {
      min-height: 38px;
      border: 1px solid #c9d4cf;
      border-radius: 8px;
      padding: 0 13px;
      color: var(--ink);
      background: #fffaf0;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn:hover {
      border-color: var(--green);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      align-items: start;
    }

    .section {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 26px rgba(28, 38, 51, 0.05);
    }

    .section-header {
      display: grid;
      grid-template-columns: 1fr 74px;
      align-items: center;
      min-height: 54px;
      color: #fff;
      background: var(--theme);
    }

    h2 {
      margin: 0;
      padding: 0 16px;
      font-size: 1rem;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .done-head {
      display: grid;
      place-items: center;
      height: 100%;
      border-left: 1px solid rgba(255, 255, 255, 0.34);
      font-weight: 700;
    }

    .item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 74px;
      min-height: 58px;
      border-top: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.62);
    }

    .topic {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 3px;
      padding: 11px 16px;
      line-height: 1.25;
    }

    .topic-name {
      font-weight: 650;
    }

    .topic-note {
      color: var(--amber);
      font-size: 0.86rem;
    }

    .check {
      display: grid;
      place-items: center;
      min-width: 0;
      border: 0;
      border-left: 1px solid var(--line);
      background: var(--soft);
      cursor: pointer;
    }

    .circle {
      width: 24px;
      height: 24px;
      border: 2px solid #7c858a;
      border-radius: 50%;
      background: #fffdf8;
      transition: transform 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .check:hover .circle,
    .check:focus-visible .circle {
      transform: scale(1.08);
      border-color: var(--theme);
    }

    .check[aria-pressed="true"] .circle {
      display: grid;
      place-items: center;
      border-color: var(--done);
      background: var(--done);
    }

    .check[aria-pressed="true"] .circle::after {
      content: "";
      width: 7px;
      height: 12px;
      border: solid #fff;
      border-width: 0 3px 3px 0;
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .notes {
      margin-top: 22px;
      border: 1px solid #d8d0bd;
      border-radius: 8px;
      background: rgba(255, 253, 248, 0.8);
      box-shadow: 0 10px 26px rgba(156, 107, 37, 0.06);
    }

    .notes h2 {
      padding: 17px 18px 0;
      color: var(--amber);
      background: transparent;
    }

    textarea {
      width: 100%;
      min-height: 116px;
      resize: vertical;
      border: 0;
      outline: 0;
      padding: 14px 18px 20px;
      color: var(--ink);
      background:
        repeating-linear-gradient(
          transparent 0,
          transparent 31px,
          rgba(156, 107, 37, 0.22) 32px
        );
      line-height: 32px;
      font-size: 1rem;
    }

    @media (max-width: 820px) {
      .page {
        width: min(100% - 18px, 560px);
        padding-top: 20px;
      }

      header {
        display: block;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }

      .actions {
        justify-content: stretch;
      }

      .action-btn {
        flex: 1;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      body {
        background: linear-gradient(180deg, #fffdf8 0%, #f8f4ec 100%);
      }

      .page {
        width: 100%;
        padding: 10px 10px 18px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 3;
        margin: 0 -10px;
        padding: 12px 12px 10px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 253, 248, 0.96);
        backdrop-filter: blur(10px);
      }

      h1 {
        font-size: clamp(2rem, 12vw, 3rem);
        line-height: 1;
      }

      .source {
        margin-top: 5px;
        font-size: 0.82rem;
      }

      .toolbar {
        position: sticky;
        top: 86px;
        z-index: 2;
        margin: 10px 0 12px;
        padding: 10px;
        gap: 10px;
        border-radius: 8px;
        background: rgba(255, 253, 248, 0.96);
        backdrop-filter: blur(10px);
      }

      .progress-meta {
        font-size: 0.84rem;
      }

      .progress {
        height: 10px;
      }

      .actions {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 6px;
      }

      .action-btn {
        min-height: 42px;
        padding: 0 6px;
        white-space: normal;
        line-height: 1.05;
        font-size: 0.78rem;
      }

      .grid {
        gap: 12px;
      }

      .section {
        border-radius: 8px;
        box-shadow: none;
      }

      .section-header,
      .item {
        grid-template-columns: minmax(0, 1fr) 64px;
      }

      .section-header {
        min-height: 48px;
      }

      h2 {
        padding: 0 12px;
        font-size: 0.88rem;
      }

      .done-head {
        font-size: 0.82rem;
      }

      .item {
        min-height: 56px;
      }

      .topic {
        padding: 10px 11px;
      }

      .topic-name {
        overflow-wrap: anywhere;
        font-size: 0.93rem;
      }

      .topic-note {
        overflow-wrap: anywhere;
        font-size: 0.78rem;
      }

      .check {
        min-height: 56px;
      }

      .circle {
        width: 28px;
        height: 28px;
      }

      .check[aria-pressed="true"] .circle::after {
        width: 8px;
        height: 14px;
      }

      .notes {
        margin-top: 14px;
        border-radius: 8px;
      }

      .notes h2 {
        padding: 14px 12px 0;
      }

      textarea {
        min-height: 112px;
        padding: 12px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <h1>Family Checklist</h1>
      </div>
    </header>

    <section class="toolbar" aria-label="Checklist controls">
      <div class="progress-wrap">
        <div class="progress-meta">
          <strong id="progressText">0 of 43 done</strong>
          <span id="progressPercent">0%</span>
        </div>
        <div class="progress" aria-hidden="true">
          <div class="progress-bar" id="progressBar"></div>
        </div>
      </div>
      <div class="actions">
        <button class="action-btn" id="markAll" type="button">Mark all done</button>
        <button class="action-btn" id="clearAll" type="button">Clear all</button>
      </div>
    </section>

    <section class="grid" id="checklistGrid"></section>

    <section class="notes" aria-label="Notes">
      <h2>Notes</h2>
      <textarea id="notes" aria-label="Checklist notes" placeholder="Write your notes here..."></textarea>
    </section>
  </main>

  <script>
    const sections = [
      {
        title: "Chest",
        theme: "#244b73",
        items: [
          { name: "BA", done: true },
          { name: "COPD", done: true },
          { name: "TB", done: true },
          { name: "PNEUMONIA", done: true }
        ]
      },
      {
        title: "Opthalmology",
        theme: "#277864",
        items: [
          { name: "Glaucoma", done: true },
          { name: "Uveitis", done: true },
          { name: "Keratitis", done: false },
          { name: "Conjunctivitis", done: true }
        ]
      },
      {
        title: "Locomotor",
        theme: "#7b6e99",
        items: [
          { name: "ORTHOPAEDICS", done: true },
          { name: "OSTEOMYELITIS", done: true },
          { name: "NEONATAL HIP SEPTIC ARTHRITIS", done: false },
          { name: "THE TUTORIAL", done: false }
        ]
      },
      {
        title: "Rheumatology",
        theme: "#8a6f3f",
        items: [
          { name: "GOUT", done: true },
          { name: "RHEUMATOID ARTHIRITS", done: true },
          { name: "Rehabilitations", done: false }
        ]
      },
      {
        title: "Neurology",
        theme: "#315f89",
        items: [
          { name: "PARKINSONISMS", done: true },
          { name: "MULTIPLE SCELIROSIS", done: true },
          { name: "CEREBRAL STROKE", done: true }
        ]
      },
      {
        title: "Hematology",
        theme: "#a24b5d",
        items: [
          { name: "ANEMIA 1", done: true },
          { name: "ANEMIA 2", done: true }
        ]
      },
      {
        title: "GIT",
        theme: "#3b7f75",
        items: [
          { name: "GERD & PUD", done: true },
          { name: "COLON CANCER", done: true },
          { name: "DYSPHAGIA", done: true },
          { name: "HEPATITIS HCC", done: false },
          { name: "IBD & INTES INFECTION", done: false },
          { name: "PANCEREATITS MALABSORB", done: true }
        ]
      },
      {
        title: "Endocrine",
        theme: "#866193",
        items: [
          { name: "ADRENAL DISORDERS", done: true },
          { name: "PITUITARY DISORDERS", done: false },
          { name: "DIABETES MELLITUS", done: true },
          { name: "THYROID DISORDERS", done: true },
          { name: "PARATHYROID DISORDERS", done: true }
        ]
      },
      {
        title: "Dermatology",
        theme: "#9b5b3d",
        items: [
          { name: "DERMA 1 PART 1", done: true },
          { name: "DERMA 1 PART 2", done: false },
          { name: "DERMA 2", done: true }
        ]
      },
      {
        title: "Cardiology",
        theme: "#b14f45",
        items: [
          { name: "HEART FAILURE", done: true },
          { name: "HYPERTENSION", done: true },
          { name: "RHEUMATIC FEVER", done: false }
        ]
      },
      {
        title: "Nephrology",
        theme: "#4c758f",
        items: [
          { name: "PHYSIOLOGY OF KIDNEY", done: true },
          { name: "RENAL FUNCTIONS & DYS", done: true },
          { name: "LOWER UT MALIGNANCIES", done: true },
          { name: "DIAGNOSTIC UT TOOLS", done: true },
          { name: "KIDNEY DISEASE SYMPT", done: true },
          { name: "LOWER UT & UB EXAMI", done: true }
        ]
      }
    ];

    const storageKey = "family-checklist-state-v1";
    const notesKey = "family-checklist-notes-v1";
    let savedState = {};
    try {
      savedState = JSON.parse(localStorage.getItem(storageKey) || "{}");
    } catch {
      savedState = {};
    }
    const grid = document.querySelector("#checklistGrid");
    const progressText = document.querySelector("#progressText");
    const progressPercent = document.querySelector("#progressPercent");
    const progressBar = document.querySelector("#progressBar");
    const notes = document.querySelector("#notes");

    function defaultState() {
      const state = {};
      sections.forEach((section, sectionIndex) => {
        section.items.forEach((item, itemIndex) => {
          state[`${sectionIndex}-${itemIndex}`] = item.done;
        });
      });
      return state;
    }

    const state = { ...defaultState(), ...savedState };

    function saveState() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        // The checklist should still work when browser storage is unavailable.
      }
    }

    function makeSection(section, sectionIndex) {
      const article = document.createElement("article");
      article.className = "section";
      article.style.setProperty("--theme", section.theme);

      const header = document.createElement("div");
      header.className = "section-header";
      header.innerHTML = `<h2>${section.title}</h2><div class="done-head">Done</div>`;
      article.appendChild(header);

      section.items.forEach((item, itemIndex) => {
        const key = `${sectionIndex}-${itemIndex}`;
        const row = document.createElement("div");
        row.className = "item";

        const topic = document.createElement("div");
        topic.className = "topic";
        const name = document.createElement("div");
        name.className = "topic-name";
        name.textContent = item.name;
        topic.appendChild(name);

        if (item.note) {
          const note = document.createElement("div");
          note.className = "topic-note";
          note.textContent = item.note;
          topic.appendChild(note);
        }

        const button = document.createElement("button");
        button.className = "check";
        button.type = "button";
        button.dataset.key = key;
        button.setAttribute("aria-label", `${item.name}: Done`);
        button.setAttribute("aria-pressed", String(Boolean(state[key])));
        button.innerHTML = '<span class="circle"></span>';

        row.append(topic, button);
        article.appendChild(row);
      });

      return article;
    }

    sections.forEach((section, sectionIndex) => {
      grid.appendChild(makeSection(section, sectionIndex));
    });

    const checks = [...document.querySelectorAll(".check")];

    function updateProgress() {
      const done = checks.filter(button => button.getAttribute("aria-pressed") === "true").length;
      const total = checks.length;
      const percent = Math.round((done / total) * 100);
      progressText.textContent = `${done} of ${total} done`;
      progressPercent.textContent = `${percent}%`;
      progressBar.style.width = `${percent}%`;
    }

    checks.forEach(button => {
      button.addEventListener("click", () => {
        const nextValue = button.getAttribute("aria-pressed") !== "true";
        button.setAttribute("aria-pressed", String(nextValue));
        state[button.dataset.key] = nextValue;
        saveState();
        updateProgress();
      });
    });

    document.querySelector("#markAll").addEventListener("click", () => {
      checks.forEach(button => {
        button.setAttribute("aria-pressed", "true");
        state[button.dataset.key] = true;
      });
      saveState();
      updateProgress();
    });

    document.querySelector("#clearAll").addEventListener("click", () => {
      if (!confirm("Clear all done marks and notes?")) return;
      checks.forEach(button => {
        button.setAttribute("aria-pressed", "false");
        state[button.dataset.key] = false;
      });
      notes.value = "";
      try {
        localStorage.removeItem(notesKey);
      } catch {
        // Ignore storage errors for local file previews.
      }
      saveState();
      updateProgress();
    });

    try {
      notes.value = localStorage.getItem(notesKey) || "";
    } catch {
      notes.value = "";
    }
    notes.addEventListener("input", () => {
      try {
        localStorage.setItem(notesKey, notes.value);
      } catch {
        // Ignore storage errors for local file previews.
      }
    });

    updateProgress();
  </script>
</body>
</html>
